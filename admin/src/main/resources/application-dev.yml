upload:
  rootPath: D:/resource





knife4j:
  # 开启增强配置
  enable: true
  production: false
  basic:
    enable: true
      # Basic认证用户名
    username: admin
      # Basic认证密码
    password: admin



spring:
  autoconfigure:
    # H2 模块管理自己的连接池，本地开发不创建额外的 Druid 数据源。
    exclude:
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
yulinlin:
  datasource:
    default-group: h2
  h2:
    # 相对 IDEA Working directory；可用环境变量指定固定的数据库位置。
    file: ${ADMIN_H2_FILE:./data/admin}
    group: h2
    mode: MYSQL
    parallel-connections: 1
    auto-server: false
    log: true
    # RBAC 查询和写入可能包含凭证，禁止打印 SQL 参数。
    log-params: true
    max-param-length: 256
    slow-sql-threshold: 1s
    schema-mode: CREATE
    schema-packages:
      - "com.yulinlin.admin"

  monitor:
    username: admin
    password: 123456
    threshold: 10ms
    max-records: 1000
