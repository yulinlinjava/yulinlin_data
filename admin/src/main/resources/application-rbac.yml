# 以 dev,rbac（或 prod,rbac）启用此案例，数据库连接继续由对应环境配置提供。
admin:
  rbac:
    token-ttl: 2h
    maximum-sessions: 10000
    bootstrap-username: ${ADMIN_RBAC_USERNAME:admin}
    bootstrap-password: ${ADMIN_RBAC_PASSWORD:}

yulinlin:
  datasource:
    default-group: mysql
  data:
    auto-update: false
  repository:
    scan-packages:
      - com.yulinlin.admin.rbac.repository
  mysql:
    schema-mode: CREATE
    schema-packages:
      - com.yulinlin.admin.rbac.domain
    # 登录、新建用户、重置密码涉及凭证，不把 SQL 参数写入日志。
    log-params: false
  security:
    limit:
      enabled: true
