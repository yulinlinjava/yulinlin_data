spring.aop.auto: true
server:
  port: 8083
  servlet:
    context-path: /


springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: admin
      packages-to-scan: com.yulinlin.admin


spring:
  boot:
    admin:
      client:
        url: http://localhost:8082

  cache:
    type: ehcache  #指定缓存类型
    ehcache:
      config: classpath:ehcache.xml #缓存加载配置文件
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev


      # 差异性配置 一般是  数据库地址  swagger 配置 框架配置
    include:
  application:
    name: yulinlin
  redis:
    database: 0
    port: 6379
    password:
    host: 127.0.0.1
  session:
    store-type: redis
  aop:
    auto: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

# RBAC 案例随 admin 正常启动，无需额外激活 rbac profile。
admin:
  rbac:
    bootstrap-username: ${ADMIN_RBAC_USERNAME:admin}
    # 为空时跳过初始管理员创建，不提供默认密码。
    bootstrap-password: ${ADMIN_RBAC_PASSWORD:}

yulinlin:
  datasource:
    default-group: mysql
  data:
    auto-update: false
    transaction-log: false

  repository:
    scan-packages:
      - com.yulinlin.admin.rbac.repository
  mysql:
    schema-mode: CREATE
    schema-packages:
      - com.yulinlin.admin.rbac.domain
    # 登录、新建用户、重置密码涉及凭证，不把 SQL 参数写入日志。
    log-params: false
    log: true
    alter-column-type: true
  security:
    jwt:
      # 必填：至少32字节随机密钥的Base64；不能使用每次启动变化的随机值。
      secret: "2o2gADWTbDfzW+UUbLZEXsI2Mf/c8Zg6l+q+7Ma861Q="
      issuer: yulinlin-admin
      ttl: 2h
    # 不提供 CryptoCodec 且不配置 crypto.devices 时不接管加解密；登录、权限和限流照常工作。
    # 接入框架加密时，再配置双方约定的设备密钥（含 unknown）和 CBC IV。
    # 全局开启后无注解接口也加解密；ApiCrypto(false) 是例外，文件等路径使用 exclude-paths。
    limit:
      enabled: true





