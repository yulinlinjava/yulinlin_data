spring.aop.auto: true
server:
  port: 8083
  servlet:
    context-path: /


springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: admin
      packages-to-scan: com.yulinlin.admin


spring:
  boot:
    admin:
      client:
        url: http://localhost:8082

  cache:
    type: ehcache  #指定缓存类型
    ehcache:
      config: classpath:ehcache.xml #缓存加载配置文件
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev


      # 差异性配置 一般是  数据库地址  swagger 配置 框架配置
    include:
  application:
    name: yulinlin
  redis:
    database: 0
    port: 6379
    password:
    host: 127.0.0.1
  session:
    store-type: redis
  aop:
    auto: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

# RBAC 案例随 admin 正常启动，无需额外激活 rbac profile。
admin:
  rbac:
    token-ttl: 2h
    maximum-sessions: 10000
    bootstrap-username: ${ADMIN_RBAC_USERNAME:admin}
    # 为空时跳过初始管理员创建，不提供默认密码。
    bootstrap-password: ${ADMIN_RBAC_PASSWORD:}

yulinlin:
  datasource:
    default-group: mysql
  data:
    auto-update: false
    transaction-log: false

  repository:
    scan-packages:
      - com.yulinlin.admin.rbac.repository
  mysql:
    schema-mode: CREATE
    schema-packages:
      - com.yulinlin.admin.rbac.domain
    # 登录、新建用户、重置密码涉及凭证，不把 SQL 参数写入日志。
    log-params: false
    log: true
    alter-column-type: true
  security:
    # 引入 security 后需要 unknown 设备配置。默认关闭报文加密，密钥每次启动随机生成。
    # 接入真实客户端时应设置 ADMIN_CRYPTO_KEY，并配置双方约定的设备密钥。
    crypto:
      enabled: false
      devices:
        unknown:
          algorithm: AES/GCM/NoPadding
          key: ${ADMIN_CRYPTO_KEY:${random.value}}
    limit:
      enabled: true





