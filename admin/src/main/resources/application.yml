spring.aop.auto: true
server:
  port: 8083
  servlet:
    context-path: /


springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: admin
      packages-to-scan: com.yulinlin.admin


spring:
  boot:
    admin:
      client:
        url: http://localhost:8082

  cache:
    type: ehcache  #指定缓存类型
    ehcache:
      config: classpath:ehcache.xml #缓存加载配置文件
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 100MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev


      # 差异性配置 一般是  数据库地址  swagger 配置 框架配置
    include:
  application:
    name: yulinlin
  redis:
    database: 0
    port: 6379
    password:
    host: 127.0.0.1
  session:
    store-type: redis
  aop:
    auto: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

# 引入 security 后需要 unknown 设备配置。示例默认关闭接口报文加密，运行时随机生成本次启动的密钥。
# 接入真实客户端时应设置 ADMIN_CRYPTO_KEY，并按接口安全专题配置双方约定的设备密钥。
yulinlin:
  security:
    crypto:
      enabled: false
      devices:
        unknown:
          algorithm: AES/GCM/NoPadding
          key: ${ADMIN_CRYPTO_KEY:${random.value}}





