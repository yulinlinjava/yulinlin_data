# 复制为同目录 application-risk-local.yml，填写后运行 AdminRiskDatabaseReplayTest。
# 本地文件已忽略 Git；仅由历史回放测试读取，不启动 admin、不自动建表。
spring:
  datasource:
    # MySQL: jdbc:mysql://127.0.0.1:3306/video?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # PG: jdbc:postgresql://127.0.0.1:5432/video
    # H2: jdbc:h2:file:./data/video;IFEXISTS=TRUE
    url: ""                  # 空值时跳过数据库回放；也可填 ${RISK_REPLAY_DB_URL}
    username: ""
    password: ""

risk-replay:
  table: video_history       # 改成实际历史表名；支持 schema.table
  user-column: user_id
  resource-column: video_id
  time-column: crt_time      # 本例读取无时区日期时间列（DATETIME / TIMESTAMP WITHOUT TIME ZONE）
  id-column: id              # 唯一事件 ID，用于去重和分页稳定排序
  user-id: ""               # 留空分析全部用户，也可填写一个用户 ID
  start: ""                 # 起止都留空：今天零点到本次运行时间
  end: ""                   # 手动指定时需同时填写；包含 start、不包含 end
  zone: Asia/Shanghai        # 历史时间所属时区
  page-size: 5000            # ORM 分页读取；所有页使用同一只读快照
  max-records: 0             # 0 加载所选范围全部记录；设置正数时超过会报错
  report-directory: target/risk-replay # 输出完整用户列表和命中依据（JSON / Markdown）
  # report-requests-greater-than: 300 # 可选：仅列出命中且请求次数 > 300 的用户，不改变识别规则
  behavior-type: video-play-url

yulinlin:
  security:
    risk:
      mode: OBSERVE         # 回放只检测，不调用 RiskControl
      behaviors:
        video-play-url:
          components: [fast-switch, active-access]
          fast-switch:
            rapid:
              window: 5m
              gap: 2s       # 严格小于
              min-videos: 50
            normal:
              window: 15m
              gap: 5s       # 小于等于
              min-videos: 200
              min-ratio: 0.70
          active-access:
            window: 6h
            active-ratio: 0.90
            min-requests: 60
